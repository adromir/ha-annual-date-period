<svg width="1024" height="320" viewBox="0 0 1024 320" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      color: var(--primary-color, #03a9f4);
    }
  </style>
  <!-- Left Icon Mark -->
  <g transform="translate(16, -16) scale(0.68)">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
<!-- Calendar Body Outline -->
    <rect x="96" y="112" width="320" height="300" rx="28" fill="none" stroke-width="22" />
    <!-- Calendar Binder Rings -->
    <line x1="168" y1="80" x2="168" y2="136" stroke-width="22" />
    <line x1="344" y1="80" x2="344" y2="136" stroke-width="22" />
    <!-- Header Separation Bar -->
    <line x1="96" y1="188" x2="416" y2="188" stroke-width="18" />
    <!-- Circular Annual Sync / Recurrence Arrow -->
    <path d="M 210 260 A 62 62 0 1 1 200 330" fill="none" stroke-width="20" />
    <!-- Arrow Head -->
    <polyline points="186,244 220,256 198,284" fill="currentColor" stroke="none" />
    </g>
  </g>

  <!-- Typography on Right -->
  <g transform="translate(360, 96)">
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1">
      Annual Date <tspan fill="#03a9f4">Period</tspan>
    </text>
    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      Home Assistant Recurring Annual Period Helper
    </text>
  </g>
</svg>
